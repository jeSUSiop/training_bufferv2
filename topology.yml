name: buffer-overflow-seedlab

hosts:
  - name: seed
    base_box:
      image: seed
      mgmt_user: ubuntu
    flavor: m1.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: lab-switch
    cidr: 10.1.30.0/24

net_mappings:
  - host: seed
    network: lab-switch
    ip: 10.1.30.10

router_mappings:
  - router: router
    network: lab-switch
    ip: 10.1.30.1

groups: []
