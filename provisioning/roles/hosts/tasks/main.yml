---
# Basic configuration of all host devices in the Buffer Overflow SeedLab

- name: Adding host aliases to /etc/hosts
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common utility tools
  apt:
    name:
      - curl
      - wget
      - net-tools
      - dnsutils
      - unzip
    state: present
